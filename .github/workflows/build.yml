name: Build and release Telegram for Apple silicon

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-macos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build native arm64 Mac Catalyst app
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Select pinned Xcode and prepare disk
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          # This is a disposable hosted runner. No simulator runtime is used by this build.
          sudo rm -rf /Library/Developer/CoreSimulator/Images /Library/Developer/CoreSimulator/Caches
          python3 - <<'PY'
          import pathlib, shutil, subprocess
          selected = pathlib.Path(subprocess.check_output(['xcode-select', '-p'], text=True).strip()).parents[1].resolve()
          for app in pathlib.Path('/Applications').glob('Xcode*.app'):
              if app.resolve() != selected and not app.is_symlink():
                  subprocess.run(['sudo', 'rm', '-rf', str(app)], check=True)
          PY
          df -h /
          xcodebuild -downloadComponent MetalToolchain

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build utilities
        run: |
          brew install cmake ninja pkg-config nasm yasm

      - name: Build Telegram.app with the configured native Mac API profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 -u build-system/macos/build.py \
            --native-mac-identity \
            --bazel-user-root "$RUNNER_TEMP/telegram-bazel" \
            --jobs 3 \
            --output "$RUNNER_TEMP/Telegram.app" 2>&1 | tee dist/build.log

      - name: Verify native protocol profile
        run: |
          python3 build-system/macos/test_protocol.py --app "$RUNNER_TEMP/Telegram.app"

      - name: Verify and archive the app bundle
        run: |
          python3 build-system/macos/release.py --app "$RUNNER_TEMP/Telegram.app" --output dist

      - name: Upload downloadable app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Telegram-macos-arm64
          path: |
            dist/Telegram-macos-arm64.zip
            dist/SHA256SUMS.txt
            dist/INSTALL.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-build-log
          path: dist/build.log
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Telegram-macos-arm64
          path: dist

      - name: Publish verified app bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="macos-${RELEASE_RUN}-${RELEASE_COMMIT:0:7}"
          cat > release-notes.md <<'NOTES'
          Native Apple silicon Mac Catalyst build of this Telegram-iOS fork. No simulator required.

          Download **Telegram-macos-arm64.zip**, extract **Telegram.app**, and drag it into **Applications**. Requires an Apple silicon Mac running macOS 15 or later.

          This build uses the pinned native Swift Telegram for macOS API identity and connection profile, matching this fork's local configuration. Account data and local configuration files are not included.

          The app is **ad hoc signed**, not Developer ID signed or notarized. On first launch, macOS may require **System Settings → Privacy & Security → Open Anyway** after attempting to open the app. This is a community build, not an official Telegram release.

          Checksums and installation instructions are attached. The full app/framework signatures, arm64 architecture, Catalyst platform, and packaged API profile are verified before publication.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Telegram-macos-arm64.zip dist/SHA256SUMS.txt dist/INSTALL.txt --clobber
          else
            gh release create "$TAG" --target "$RELEASE_COMMIT" \
              --title "Telegram for Apple silicon · build ${RELEASE_RUN}" \
              --notes-file release-notes.md --latest \
              dist/Telegram-macos-arm64.zip dist/SHA256SUMS.txt dist/INSTALL.txt
          fi
          echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
